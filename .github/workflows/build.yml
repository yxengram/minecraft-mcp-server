name: CI Build

# extra-tools is the release branch (E-024), so its commits are checked as well as main's.
on:
  push:
    branches: [ extra-tools, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    # macOS and Windows minutes count 10 and 2 times while the repository is private (E-026).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.x'
          - os: ubuntu-latest
            node: '24.x'
          - os: macos-latest
            node: '22.x'
          - os: windows-latest
            node: '22.x'

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: TypeCheck
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

    - name: Test
      run: npm test

    # No game: the server only meets a closed port on 127.0.0.1 (F-051).
    - name: Smoke test
      run: npm run test:smoke

    # The package checks run once. --ignore-scripts: Build has already made dist/, and the output of prepare
    # would end up in the JSON on stdout.
    - name: Pack
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: |
        npm shrinkwrap
        npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
        echo "PACKAGE_TGZ=$RUNNER_TEMP/$(node -p "require(process.env.RUNNER_TEMP + '/pack.json')[0].filename")" >> "$GITHUB_ENV"
        echo "PACKAGE_NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

    - name: Check the package contents
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: node scripts/test-smoke.mjs --pack-report "$RUNNER_TEMP/pack.json"

    # npm-shrinkwrap.json in the package pins minecraft-protocol and prismarine-* to the versions CI tested (E-025).
    # npm follows a dependency's shrinkwrap only when the registry's metadata says it has one (_hasShrinkwrap), and a
    # local tarball never does, so the pinned tree is installed the way the registry would: npm ci inside the unpacked
    # package, from its own npm-shrinkwrap.json (checked 2026-10-31).
    - name: Install the package from its shrinkwrap
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: |
        mkdir "$RUNNER_TEMP/pinned"
        tar -xzf "$PACKAGE_TGZ" -C "$RUNNER_TEMP/pinned"
        cd "$RUNNER_TEMP/pinned/package"
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    - name: Compare the installed versions with the lockfile
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: node scripts/test-smoke.mjs --compare-lock "$RUNNER_TEMP/pinned/package" "$RUNNER_TEMP/pinned/package/npm-shrinkwrap.json"

    - name: Smoke test the package installed from its shrinkwrap
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: npm run test:smoke -- "$RUNNER_TEMP/pinned/package/dist/main.js"

    # An empty project without a lockfile, installing the local tarball: npm resolves the dependencies itself here (it
    # leaves the shrinkwrap out, see above), so this checks that the newest versions the ranges allow still start.
    - name: Install the package
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: |
        mkdir "$RUNNER_TEMP/install"
        cd "$RUNNER_TEMP/install"
        npm init -y
        npm install --no-audit --no-fund "$PACKAGE_TGZ"

    - name: Smoke test the installed package
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: npm run test:smoke -- "$RUNNER_TEMP/install/node_modules/$PACKAGE_NAME/dist/main.js"

    - name: Upload the package
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      uses: actions/upload-artifact@v6
      with:
        name: npm-package
        path: ${{ env.PACKAGE_TGZ }}
        retention-days: 14

    # The MCPB extension for Claude Desktop (E-047). npm shrinkwrap in Pack has renamed package-lock.json, and
    # build:mcpb takes npm-shrinkwrap.json first, so the extension installs the tree tested above.
    - name: Build the MCPB extension
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: |
        npm run build:mcpb
        echo "MCPB_FILE=$PWD/build/$(node -p "const { name, version } = require('./mcpb/manifest.json'); name + '-' + version").mcpb" >> "$GITHUB_ENV"

    # As Claude Desktop runs it: dist/main.js of the unpacked extension, with the node_modules inside it.
    - name: Smoke test the unpacked extension
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      run: |
        npx mcpb unpack "$MCPB_FILE" "$RUNNER_TEMP/mcpb"
        npm run test:smoke -- "$RUNNER_TEMP/mcpb/dist/main.js"

    - name: Upload the extension
      if: matrix.os == 'ubuntu-latest' && matrix.node == '22.x'
      uses: actions/upload-artifact@v6
      with:
        name: mcpb-extension
        path: ${{ env.MCPB_FILE }}
        retention-days: 14
